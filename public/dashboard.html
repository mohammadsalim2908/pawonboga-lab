<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — TekniKita</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <div class="dash">
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a3.5 3.5 0 1 0 3 3l-8 8a2.1 2.1 0 1 1-3-3l8-8Z"/><path d="M17 3l4 4"/></svg>
        </span>
        <span class="brand-text">
          <strong>Tekni<em>Kita</em></strong>
          <small>Panel pengelola</small>
        </span>
      </a>
      <nav class="side-nav" id="sideNav" aria-label="Navigasi dashboard"></nav>
      <div class="side-foot">
        <div class="side-user" id="sideUser"></div>
        <button class="btn btn-outline btn-sm" type="button" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9"/><path d="M18 12H9"/><path d="m15 8 4 4-4 4"/></svg>
          Keluar
        </button>
      </div>
    </aside>

    <main class="dash-main">
      <div class="dash-topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Memuat…</p>
        </div>
        <div class="dash-actions" id="pageActions"></div>
      </div>
      <div id="dashView">
        <div class="loading-block"><span class="spinner"></span> Memuat dashboard…</div>
      </div>
    </main>
  </div>

  <div class="toast-root" id="toastRoot" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script type="module" src="/assets/js/dashboard.js"></script>
</body>
</html>
